name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"

    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Display Tools Versions
      run: |
        dotnet --version
        cmake --version

    - name: Build Native (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\build\native-win.ps1

    - name: Build Native (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./build/native-linux.sh

    - name: Set Native Path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "CYCLONEDDS_NATIVE_DIR=${{ github.workspace }}\artifacts\native\win-x64" >> $env:GITHUB_ENV

    - name: Set Native Path (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CYCLONEDDS_NATIVE_DIR=${{ github.workspace }}/artifacts/native/linux-x64" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/artifacts/native/linux-x64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Build Solution
      run: dotnet build CycloneDDS.NET.Core.slnf -c Release

    - name: Run Tests
      run: dotnet test CycloneDDS.NET.Core.slnf -c Release --no-build --logger trx --results-directory artifacts/testresults

    - name: Linux NuGet Smoke (Real DDS)
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./build/linux-nuget-smoke.sh

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ runner.os }}
        path: artifacts/testresults/**/*.trx

    - name: Upload Native Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: native-artifacts-${{ matrix.os }}
        path: artifacts/native/

  pack:
    needs: build
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Download Windows Native Artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-artifacts-windows-latest
        path: artifacts/native

    - name: Download Linux Native Artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-artifacts-ubuntu-latest
        path: artifacts/native

    - name: Build, Test, and Pack
      shell: pwsh
      run: .\build\pack.ps1

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg

    - name: Upload Symbol Packages
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: symbol-packages
        path: artifacts/nuget/*.snupkg
        if-no-files-found: warn

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push artifacts/nuget/*.nupkg `
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
          --api-key ${{ secrets.GITHUB_TOKEN }} `
          --skip-duplicate
      shell: pwsh

  release:
    needs: pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download NuGet Packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget

    - name: Download Symbol Packages
      uses: actions/download-artifact@v4
      with:
        name: symbol-packages
        path: artifacts/nuget

    - name: Download Windows Native Artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-artifacts-windows-latest
        path: artifacts/native-windows

    - name: Download Linux Native Artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-artifacts-ubuntu-latest
        path: artifacts/native-linux

    - name: Package Native Artifacts
      run: |
        cd artifacts
        tar -czf native-win-x64.tar.gz -C native-windows .
        tar -czf native-linux-x64.tar.gz -C native-linux .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/*.snupkg
          artifacts/native-win-x64.tar.gz
          artifacts/native-linux-x64.tar.gz
